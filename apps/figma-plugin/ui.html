<style>
  body {
    margin: 0;
    padding: 12px;
    font: 12px/16px Inter, system-ui, sans-serif;
    color: var(--figma-color-text, #111);
    background: var(--figma-color-bg, #fff);
  }
  p { margin: 0 0 8px; color: var(--figma-color-text-secondary, #555); }
  button {
    width: 100%;
    margin-top: 6px;
    padding: 7px 8px;
    border: 1px solid var(--figma-color-border, #ddd);
    border-radius: 6px;
    background: var(--figma-color-bg, #fff);
    color: inherit;
    font: inherit;
    cursor: pointer;
  }
  button.primary { border: 0; background: var(--figma-color-bg-brand, #0d99ff); color: var(--figma-color-text-onbrand, #fff); }
  button:disabled { opacity: 0.4; cursor: default; }
  .stats { color: var(--figma-color-text, #111); }
  details { margin-top: 8px; color: var(--figma-color-text-secondary, #555); }
  details ul { margin: 4px 0 0; padding-left: 16px; max-height: 80px; overflow: auto; }
  [hidden] { display: none; }
</style>
<p>The file's variables and styles as DTCG tokens, for Token Diff, Token Fix and CI. Nothing in the file is changed.</p>
<button type="button" id="run" class="primary">Read variables and styles</button>
<div id="done" hidden>
  <p class="stats" id="stats"></p>
  <button type="button" id="zip">Download .zip: a file per collection and mode, with a resolver</button>
  <button type="button" id="one">Download one file: modes inside each token</button>
  <button type="button" id="copy">Copy one file</button>
  <details id="notes" hidden><summary></summary><ul></ul></details>
</div>
<p id="error" hidden></p>
<script>
  const $ = (id) => document.getElementById(id)
  let result = null
  const safe = (s) => s.replace(/[\\/:*?"<>|]+/g, '-').trim() || 'tokens'
  const json = (v) => `${JSON.stringify(v, null, 2)}\n`

  // A ZIP without compression: token files are small, and nothing has to be installed.
  const CRC = (() => {
    const t = new Uint32Array(256)
    for (let n = 0; n < 256; n++) {
      let c = n
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1
      t[n] = c >>> 0
    }
    return t
  })()
  const crc32 = (b) => {
    let c = 0xffffffff
    for (let i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 0xff] ^ (c >>> 8)
    return (c ^ 0xffffffff) >>> 0
  }
  function zip(files) {
    const enc = new TextEncoder()
    const parts = []
    const central = []
    let offset = 0
    for (const [path, text] of files) {
      const name = enc.encode(path)
      const data = enc.encode(text)
      const crc = crc32(data)
      const head = new DataView(new ArrayBuffer(30))
      head.setUint32(0, 0x04034b50, true)
      head.setUint16(4, 20, true)
      head.setUint16(6, 0x0800, true)
      head.setUint32(14, crc, true)
      head.setUint32(18, data.length, true)
      head.setUint32(22, data.length, true)
      head.setUint16(26, name.length, true)
      parts.push(new Uint8Array(head.buffer), name, data)
      const dir = new DataView(new ArrayBuffer(46))
      dir.setUint32(0, 0x02014b50, true)
      dir.setUint16(4, 20, true)
      dir.setUint16(6, 20, true)
      dir.setUint16(8, 0x0800, true)
      dir.setUint32(16, crc, true)
      dir.setUint32(20, data.length, true)
      dir.setUint32(24, data.length, true)
      dir.setUint16(28, name.length, true)
      dir.setUint32(42, offset, true)
      central.push(new Uint8Array(dir.buffer), name)
      offset += 30 + name.length + data.length
    }
    const size = central.reduce((n, p) => n + p.length, 0)
    const end = new DataView(new ArrayBuffer(22))
    end.setUint32(0, 0x06054b50, true)
    end.setUint16(8, files.length, true)
    end.setUint16(10, files.length, true)
    end.setUint32(12, size, true)
    end.setUint32(16, offset, true)
    return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type: 'application/zip' })
  }
  const save = (blob, name) => {
    const a = document.createElement('a')
    a.href = URL.createObjectURL(blob)
    a.download = name
    a.click()
  }

  $('run').onclick = () => {
    $('run').disabled = true
    $('error').hidden = true
    parent.postMessage({ pluginMessage: { type: 'export' } }, '*')
  }
  $('zip').onclick = () =>
    save(zip(Object.entries(result.files).map(([p, v]) => [`tokens/${p}`, json(v)])), `${safe(result.name)} tokens.zip`)
  $('one').onclick = () =>
    save(new Blob([json(result.single)], { type: 'application/json' }), `${safe(result.name)}.tokens.json`)
  $('copy').onclick = async () => {
    // The plugin frame may not have clipboard permission: the old way works there.
    const area = document.createElement('textarea')
    area.value = json(result.single)
    document.body.append(area)
    area.select()
    document.execCommand('copy')
    area.remove()
    $('copy').textContent = 'Copied'
    setTimeout(() => ($('copy').textContent = 'Copy one file'), 1500)
  }

  window.addEventListener('message', (e) => {
    const m = e.data.pluginMessage
    $('run').disabled = false
    if (m.type === 'error') {
      $('error').hidden = false
      $('error').textContent = m.message
      return
    }
    result = m
    const s = m.stats
    $('done').hidden = false
    $('stats').textContent = `${s.variables} variables in ${s.collections} collections, ${s.styles} styles.`
    const notes = $('notes')
    notes.hidden = m.notes.length === 0
    notes.querySelector('summary').textContent = `${m.notes.length} left out or changed`
    notes.querySelector('ul').innerHTML = ''
    for (const n of m.notes) {
      const li = document.createElement('li')
      li.textContent = `${n.name}: ${n.message}`
      notes.querySelector('ul').append(li)
    }
  })
</script>
