name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build -w @dsgraph/action
      - run: npm run build -w @specsure/web
        env:
          ASTRO_TELEMETRY_DISABLED: 1
      - run: npx tsc -p apps/web --noEmit
      - run: npm test
      - run: npm run lint
